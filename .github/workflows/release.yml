# Foundry-style release: push tag vX.Y.Z → GitHub Release with module.zip (folder = module id) + module.json
# (manifest/download URLs point at this tag’s release assets).

name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify tag matches module.json version
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          case "$TAG" in v*.*.*) ;; *)
            echo "::error::Tag must look like v1.2.3, got: $TAG"
            exit 1
          ;; esac
          TAG_VER="${TAG#v}"
          MVER=$(jq -r .version module.json)
          if [ "$TAG_VER" != "$MVER" ]; then
            echo "::error::Tag $TAG implies version $TAG_VER but module.json has $MVER — bump module.json (and package.json) before tagging."
            exit 1
          fi

      - name: Stage module folder and inject manifest URLs
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          MODULE_ID=$(jq -r .id module.json)
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          mkdir -p "staging/${MODULE_ID}"
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='staging' \
            --exclude='dist' \
            ./ "staging/${MODULE_ID}/"
          jq --arg manifest "${BASE}/module.json" --arg download "${BASE}/module.zip" \
            '. + {manifest: $manifest, download: $download}' module.json \
            > "staging/${MODULE_ID}/module.json"
          mkdir -p dist
          cp "staging/${MODULE_ID}/module.json" dist/module.json
          (cd staging && zip -rq ../dist/module.zip "$MODULE_ID")

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/module.zip
            dist/module.json
          generate_release_notes: true
